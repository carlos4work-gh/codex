name: Memythos arena CI

on:
  pull_request:
    paths:
      - ".codespellignore"
      - "codex-rs/Cargo.lock"
      - "codex-rs/Cargo.toml"
      - "codex-rs/app-server/**"
      - "codex-rs/app-server-protocol/**"
      - "codex-rs/cli/**"
      - "codex-rs/config/**"
      - "codex-rs/core/**"
      - "codex-rs/ext/goal/**"
      - "codex-rs/memories/write/**"
      - "codex-rs/protocol/**"
      - "codex-rs/rollout/**"
      - "codex-rs/state/**"
      - "codex-rs/thread-store/**"
      - "docs/memythos/**"
      - "scripts/memythos/**"
      - ".github/workflows/memythos-arena-ci.yml"
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  arena-contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582

      - name: Fetch Codex upstream baseline
        working-directory: ${{ github.workspace }}
        run: |
          git remote add upstream https://github.com/openai/codex.git
          git fetch --no-tags upstream main

      - name: Report upstream impact on all fork sources
        working-directory: ${{ github.workspace }}
        run: scripts/memythos/upstream-impact-check.sh

      - name: Compile extended fork source boundary
        run: >-
          cargo check
          -p codex-cli
          -p codex-config
          -p codex-goal-extension
          -p codex-memories-write
          -p codex-protocol
          -p codex-rollout
          -p codex-thread-store

      - name: Judge ranking regression
        run: cargo test -p codex-app-server native_judge_verdict_requires_each_rejected_alternative_exactly_once

      - name: Bounded resume regression
        run: cargo test -p codex-app-server arena_request_partially_resumes_without_replanning_the_active_composition

      - name: Native proposal fanout reconciliation
        run: cargo test -p codex-app-server completed_bettor_proposals_fan_out_and_trigger_each_bettor_once

      - name: OOTB Arena snapshot persistence
        run: cargo test -p codex-state arena_snapshot_round_trips_without_semantic_concierge_state

      - name: Durable native mailbox state contract
        run: cargo test -p codex-state native_mailbox_

      - name: Native mailbox quarantine protocol contract
        run: cargo test -p codex-app-server-protocol memythos_mailbox_quarantine_methods_deserialize

      - name: Canonical Rust state reducer
        run: cargo test -p codex-app-server memythos_arena_state::tests

      - name: Requester disconnect regression
        run: cargo test -p codex-app-server arena_request_state_survives_the_request_connection_boundary

      - name: OOTB Arena restart recovery
        run: cargo test -p codex-app-server canonical_arena_restores_from_ootb_state_without_replanning

      - name: Arena SIGKILL recovery boundary
        run: cargo test -p codex-app-server --test all arena_provision_checkpoint_survives_sigkill_without_duplicate_parents

      - name: Native mailbox payload rehydration after SIGKILL
        run: cargo test -p codex-app-server --test all arena_mailbox_payload_rehydrates_after_sigkill_and_is_consumed_once

      - name: Native mailbox crash-loop quarantine and live retry
        run: cargo test -p codex-app-server --test all arena_mailbox_crash_loop_quarantines_poison_payload_and_warns

      - name: Native mailbox contention, audit, and operational health
        run: cargo test -p codex-app-server --test all arena_mailbox_terminal_resolutions_and_replace_survive_restart

      - name: Arena turn acknowledgement after SIGKILL
        run: cargo test -p codex-app-server --test all arena_completed_turn_ack_survives_sigkill_without_duplicate_turn
