name: Memythos arena CI

on:
  pull_request:
    paths:
      - ".codespellignore"
      - "codex-rs/Cargo.lock"
      - "codex-rs/Cargo.toml"
      - "codex-rs/app-server/**"
      - "codex-rs/app-server-protocol/**"
      - "codex-rs/cli/**"
      - "codex-rs/config/**"
      - "codex-rs/core/**"
      - "codex-rs/ext/goal/**"
      - "codex-rs/memories/write/**"
      - "codex-rs/protocol/**"
      - "codex-rs/rollout/**"
      - "codex-rs/state/**"
      - "codex-rs/thread-store/**"
      - "docs/memythos/**"
      - "scripts/memythos/**"
      - ".github/workflows/memythos-arena-ci.yml"
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  arena-contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582

      - name: Fetch Codex upstream baseline
        working-directory: ${{ github.workspace }}
        run: |
          git remote add upstream https://github.com/openai/codex.git
          git fetch --no-tags upstream main

      - name: Report upstream impact on all fork sources
        working-directory: ${{ github.workspace }}
        run: scripts/memythos/upstream-impact-check.sh

      - name: Enforce upstream manual overlap budget
        working-directory: ${{ github.workspace }}
        run: |
          scripts/memythos/upstream-overlap-gate.sh
          scripts/memythos/upstream-overlap-gate-test.sh

      - name: Verify fork source connectivity
        working-directory: ${{ github.workspace }}
        run: scripts/memythos/fork-source-connectivity.sh

      - name: External app-server restart budget
        working-directory: ${{ github.workspace }}
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest scripts/memythos/test_app_server_restart_supervisor.py -v

      - name: App-server supervisor readiness marker contract
        run: cargo test -p codex-app-server memythos_readiness_marker_contains_only_process_identity

      - name: Enforce descending processor boundary
        working-directory: ${{ github.workspace }}
        run: |
          scripts/memythos/processor-boundary-gate.sh
          scripts/memythos/processor-boundary-gate-test.sh

      - name: Compile extended fork source boundary
        run: >-
          cargo check
          -p codex-app-server
          -p codex-app-server-protocol
          -p codex-cli
          -p codex-config
          -p codex-core
          -p codex-goal-extension
          -p codex-memories-write
          -p codex-protocol
          -p codex-rollout
          -p codex-state
          -p codex-thread-store

      - name: Generated app-server protocol drift
        run: cargo test -p codex-app-server-protocol schema_fixtures_match_generated

      - name: Judge ranking regression
        run: cargo test -p codex-app-server native_judge_verdict_requires_each_rejected_alternative_exactly_once

      - name: Bounded resume regression
        run: cargo test -p codex-app-server arena_request_partially_resumes_without_replanning_the_active_composition

      - name: Native proposal fanout reconciliation
        run: cargo test -p codex-app-server completed_bettor_proposals_fan_out_and_trigger_each_bettor_once

      - name: OOTB Arena snapshot persistence
        run: cargo test -p codex-state arena_snapshot_round_trips_without_semantic_concierge_state

      - name: Memythos runtime state projection
        run: cargo test -p codex-app-server memythos_runtime_state::tests

      - name: Memythos runtime coordination boundary
        run: |
          cargo test -p codex-app-server memythos_runtime::tests
          cargo test -p codex-app-server reports_runtime_health_and_clean_close

      - name: Memythos closure boundary
        run: |
          cargo test -p codex-app-server arena_terminalizes_after_native_judge_returns_a_structured_verdict
          cargo test -p codex-app-server partial_resume_closes_after_affected_reassessment_and_canonical_judge_verdict

      - name: Memythos round task boundary
        run: |
          cargo test -p codex-app-server arena_composition_requires_explicit_revision_and_reuses_only_kept_identity
          cargo test -p codex-app-server completed_bettor_phase_fans_out_through_native_aggregate_mailboxes

      - name: Memythos room contract boundary
        run: |
          cargo test -p codex-app-server room_registration_rejects_duplicate_threads
          cargo test -p codex-app-server room_registration_rejects_legacy_observer_concierge_encoding
          cargo test -p codex-app-server room_tool_lists_registered_parent_threads

      - name: Memythos room routing boundary
        run: |
          cargo test -p codex-app-server competitive_room_requires_explicit_semantic_message_kinds
          cargo test -p codex-app-server competitive_room_routes_phases_through_their_native_roles
          cargo test -p codex-app-server competitive_room_cannot_request_judge_before_plural_bets_complete
          cargo test -p codex-app-server partial_resume_intake_authorizes_only_one_combined_reassessment_per_affected_parent

      - name: Memythos loopback materialization boundary
        run: |
          cargo test -p codex-app-server native_judge_targeted_refinement_contract_is_bounded_and_attributable
          cargo test -p codex-app-server partial_resume_intake_authorizes_only_one_combined_reassessment_per_affected_parent
          cargo test -p codex-app-server completed_bettor_proposals_fan_out_and_trigger_each_bettor_once
          cargo test -p codex-app-server room_send_input_uses_native_loopback_delivery
          cargo test -p codex-app-server room_send_input_prefers_concierge_source_when_present

      - name: Memythos activity and continuity boundary
        run: |
          cargo test -p codex-app-server room_activity_list_returns_compact_initial_view
          cargo test -p codex-app-server room_activity_list_uses_native_agent_message_completion_projection
          cargo test -p codex-app-server parent_continuity_tracks_multiple_receiver_turns
          cargo test -p codex-app-server parent_continuity_is_verified_with_goal_snapshot_and_completed_turn
          cargo test -p codex-app-server room_timeline_get_reports_final_native_source_method
          cargo test -p codex-app-server attaches_threads_and_filters_telemetry_refs
          cargo test -p codex-app-server native_telemetry_refs_are_source_tagged_and_compact

      - name: Memythos query handler boundary
        run: |
          cargo test -p codex-app-server native_turn_completion_promotes_parent_peer_observation
          cargo test -p codex-app-server canonical_arena_lifecycle_is_owned_by_rust_across_rpc_calls

      - name: Memythos native event handler boundary
        run: |
          cargo test -p codex-app-server room_activity_list_summarizes_delivery_without_closing_arena
          cargo test -p codex-app-server arena_terminalizes_after_native_judge_returns_a_structured_verdict

      - name: Memythos aggregate checkpoint boundary
        run: |
          cargo test -p codex-app-server aggregate_then_trigger_queues_until_expected_sources_are_complete
          cargo test -p codex-app-server aggregate_then_trigger_does_not_count_duplicate_messages
          cargo test -p codex-app-server autonomous_bet_aggregate_applies_the_native_judge_contract
          cargo test -p codex-app-server native_bettor_turns_receive_mechanism_output_contracts
          cargo test -p codex-app-server native_judge_targeted_refinement_contract_is_bounded_and_attributable

      - name: Legacy Memythos migration upgrade
        run: cargo test -p codex-state upgrades_legacy_memythos_migrations_without_checksum_conflicts

      - name: Durable native mailbox state contract
        run: cargo test -p codex-state native_mailbox_

      - name: OOTB peer delivery adapter boundary
        run: |
          cargo test -p codex-app-server memythos_peer_delivery::tests
          cargo test -p codex-app-server native_mailbox_wake_policy_
          cargo test -p codex-app-server peer_parent_delivery_

      - name: Memythos observability contract
        run: cargo test -p codex-app-server memythos_observability::tests

      - name: Memythos consolidation contract
        run: |
          cargo test -p codex-app-server memythos_contracts::tests
          cargo test -p codex-app-server thread_consolidate_
          cargo test -p codex-app-server thread_contract_assemble_

      - name: OOTB thread consolidation adapter boundary
        run: |
          cargo test -p codex-app-server memythos_thread_consolidation::tests
          cargo test -p codex-app-server thread_consolidate_rejects_empty_sources
          cargo test -p codex-app-server thread_consolidate_uses_native_summary_and_coordinator_turn
          cargo test -p codex-app-server thread_contract_assemble_registers_native_contract_ref
          cargo test -p codex-app-server thread_contract_assemble_rejects_foreign_evidence_
          cargo test -p codex-app-server thread_contract_assemble_rejects_missing_output_schema

      - name: Memythos resume lifecycle contract
        run: |
          cargo test -p codex-app-server memythos_resume::tests
          cargo test -p codex-app-server arena_intake_
          cargo test -p codex-app-server partial_resume_
          cargo test -p codex-app-server arena_request_partially_resumes_
          cargo test -p codex-app-server arena_request_retains_decision_
          cargo test -p codex-app-server arena_request_requires_explicit_comparability_

      - name: Memythos judge contract
        run: |
          cargo test -p codex-app-server memythos_judge::tests
          cargo test -p codex-app-server native_judge_
          cargo test -p codex-app-server judge_verdict_schema_
          cargo test -p codex-app-server targeted_judge_verdict_
          cargo test -p codex-app-server arena_terminalizes_after_native_judge_

      - name: Memythos delivery orchestration contract
        run: |
          cargo test -p codex-app-server memythos_delivery::tests
          cargo test -p codex-app-server aggregate_then_trigger_
          cargo test -p codex-app-server completed_bettor_phase_fans_out_
          cargo test -p codex-app-server room_tool_aggregates_bets_
          cargo test -p codex-app-server competitive_concierge_dispatches_
          cargo test -p codex-app-server canonical_concierge_checkpoint_
          cargo test -p codex-app-server room_delivery_
          cargo test -p codex-app-server budget_limited_parent_requires_native_replan_
          cargo test -p codex-app-server automatic_mailbox_delivery_rearms_

      - name: Memythos composition contract
        run: |
          cargo test -p codex-app-server memythos_composition::tests
          cargo test -p codex-app-server arena_composition_
          cargo test -p codex-app-server cost_envelope_
          cargo test -p codex-app-server explicit_cost_cap_
          cargo test -p codex-app-server native_method_authority_
          cargo test -p codex-app-server downstream_delegate_
          cargo test -p codex-app-server ordinary_competitive_arena_

      - name: Memythos native parent provisioning boundary
        run: |
          cargo test -p codex-app-server memythos_parent_provisioning::tests
          cargo test -p codex-app-server native_parent_setup_
          cargo test -p codex-app-server reusable_parent_
          cargo test -p codex-app-server arena_composition_provisions_
          cargo test -p codex-app-server arena_composition_rolls_back_
          cargo test -p codex-app-server arena_composition_requires_explicit_revision_

      - name: Memythos composition planning boundary
        run: |
          cargo test -p codex-app-server memythos_port_error::tests
          cargo test -p codex-app-server memythos_composition_planning::tests
          cargo test -p codex-app-server memythos_resume::tests
          cargo test -p codex-app-server arena_composition_schema_
          cargo test -p codex-app-server native_cross_read_
          cargo test -p codex-app-server native_bet_
          cargo test -p codex-app-server native_bettor_turns_
          cargo test -p codex-app-server arena_request_rejects_missing_planner_evidence_
          cargo test -p codex-app-server arena_request_partially_resumes_
          cargo test -p codex-app-server arena_request_retains_decision_
          cargo test -p codex-app-server arena_request_requires_explicit_comparability_

      - name: Memythos fake runtime full round
        run: cargo test -p codex-app-server fake_runtime_executes_a_complete_competitive_round

      - name: Memythos parent configuration boundary
        run: |
          cargo test -p codex-app-server memythos_parent_configuration::tests
          cargo test -p codex-app-server room_activity_list_exposes_native_registration_cursor_events

      - name: Memythos parent response boundary
        run: |
          cargo test -p codex-app-server memythos_parent_response::tests
          cargo test -p codex-app-server room_tool_reconciles_parent_completion_
          cargo test -p codex-app-server room_tool_waits_
          cargo test -p codex-app-server room_activity_list_blocks_completed_turn_
          cargo test -p codex-app-server room_activity_list_uses_native_agent_message_

      - name: Memythos parent goal boundary
        run: |
          cargo test -p codex-app-server memythos_parent_goal::tests
          cargo test -p codex-app-server parent_continuity_tracks_
          cargo test -p codex-app-server parent_continuity_is_verified_
          cargo test -p codex-app-server judge_completion_atomically_
          cargo test -p codex-app-server successful_bounded_delivery_

      - name: Independent root role rollout contract
        run: cargo test -p codex-rollout explicit_root_agent_role_overrides_source_derived_role

      - name: Independent root role resume contract
        run: cargo test -p codex-history resumed_history_preserves_explicit_root_agent_role

      - name: Native mailbox quarantine protocol contract
        run: cargo test -p codex-app-server-protocol memythos_mailbox_quarantine_methods_deserialize

      - name: Canonical Rust state reducer
        run: |
          cargo test -p codex-app-server memythos_arena_state::tests
          cargo test -p codex-app-server canonical_arena_lifecycle_is_owned_by_rust_across_rpc_calls
          bash scripts/memythos/arena-transition-authority-gate.sh

      - name: Requester disconnect regression
        run: cargo test -p codex-app-server arena_request_state_survives_the_request_connection_boundary

      - name: OOTB Arena restart recovery
        run: |
          cargo test -p codex-app-server canonical_arena_restores_from_ootb_state_without_replanning
          cargo test -p codex-app-server arena_restore_rejects_a_corrupt_batch_without_partial_state

      - name: Arena SIGKILL recovery boundary
        run: |
          cargo test -p codex-app-server --test all arena_provision_checkpoint_survives_sigkill_without_duplicate_parents
          cargo test -p codex-app-server --test all arena_sealed_aggregate_activation_resumes_after_sigkill_once

      - name: Native mailbox payload rehydration after SIGKILL
        run: |
          cargo test -p codex-app-server --test all arena_mailbox_payload_rehydrates_after_sigkill_and_is_consumed_once
          cargo test -p codex-app-server --test all arena_staged_mailbox_effect_materializes_once_with_native_submission_id

      - name: Native mailbox quarantine, Concierge pause, resolution, and live retry
        run: |
          cargo test -p codex-app-server --test all arena_mailbox_crash_loop_quarantines_poison_payload_and_warns
          cargo test -p codex-app-server --test all arena_mailbox_quarantine_pauses_only_its_own_room

      - name: Native mailbox multi-blocker pause, contention, audit, and health
        run: |
          cargo test -p codex-app-server --lib memythos_global_serialization_excludes_requests_from_different_connections
          cargo test -p codex-app-server --test all arena_mailbox_terminal_resolutions_and_replace_survive_restart

      - name: Arena turn acknowledgement after SIGKILL
        run: cargo test -p codex-app-server --test all arena_terminal_turn_reconciles_after_sigkill_without_duplicate_turn

      - name: Full Memythos Arena recovery regression
        run: cargo test -p codex-app-server --test all v2::memythos_arena_recovery
